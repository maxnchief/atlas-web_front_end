<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies Example</title>
</head>
<body>
    <h1>Cookie Login</h1>
    
    <div>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" placeholder="first name">
    </div>
    
    <div>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="email">
    </div>
    
    <div>
        <button onclick="setCookies()">Log me in</button>
        <button onclick="showCookies()">Show the cookies</button>
    </div>

    <script>
        function setCookies() {
            const firstname = document.getElementById('firstname').value;
            const email = document.getElementById('email').value;
            
            // Set cookies that expire in 10 days
            const expires = new Date();
            expires.setDate(expires.getDate() + 10);
            
            document.cookie = `firstname=${firstname}; expires=${expires.toUTCString()}; path=/`;
            document.cookie = `email=${email}; expires=${expires.toUTCString()}; path=/`;
            
            console.log('Cookies set successfully');
        }
        
        function getCookie(name) {
            const cookies = document.cookie.split(';');
            
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                
                if (cookie.indexOf(name + '=') === 0) {
                    return cookie.substring(name.length + 1);
                }
            }
            
            return '';
        }
        
        function showCookies() {
            const email = getCookie('email');
            const firstname = getCookie('firstname');
            
            const paragraph = document.createElement('p');
            paragraph.innerHTML = `Email: ${email} - Firstname: ${firstname}`;
            document.body.appendChild(paragraph);
        }
    </script>
</body>
</html>
